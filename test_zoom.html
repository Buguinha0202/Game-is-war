<!DOCTYPE html>
<html>
<head>
<style>
body { background: #131f24; color: white; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
.card { width: 110px; height: 110px; border-radius: 20px; background: #202f36; border: 2px solid #37464f; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
.card img { width: 100%; height: 100%; object-fit: contain; }
.card.zoom-face img { transform: scale(1.6) translateY(8%); }
.card.zoom-upper img { transform: scale(1.22) translateY(5%); }
</style>
</head>
<body>
  <div>
    <h4>Zoom Face with Glasses</h4>
    <div class="card zoom-face"><img src="g_1.png"></div>
  </div>
  <div>
    <h4>No Zoom with Glasses</h4>
    <div class="card"><img src="g_1.png"></div>
  </div>
</body>
</html>
